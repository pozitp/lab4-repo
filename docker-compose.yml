services:
  db:
    image: postgres:15-alpine
    container_name: postgres-lab4
    environment:
      POSTGRES_DB: lab4db
      POSTGRES_USER: lab4user
      POSTGRES_PASSWORD: lab4pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lab4user -d lab4db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab4-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lab4db
      SPRING_DATASOURCE_USERNAME: lab4user
      SPRING_DATASOURCE_PASSWORD: lab4pass
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab4-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres-data:
