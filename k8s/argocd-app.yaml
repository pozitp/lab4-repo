apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab4-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pozitp/lab4-repo
    targetRevision: HEAD
    path: k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
